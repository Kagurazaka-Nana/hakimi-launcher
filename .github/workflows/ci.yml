name: Simple Sonar CI

on:
  push:
    branches: [ "main", "dev", "dev-kotlin" ]
  pull_request:
    branches: [ "main", "dev", "dev-kotlin" ]

jobs:
  sonar-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests & Sonar Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew test jacocoTestReport sonar \
            -Dsonar.organization=kagurazaka-nana \
            -Dsonar.projectKey=Kagurazaka-Nana_hakimi-launcher \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
            -Dsonar.coverage.exclusions=src/main/kotlin/com/minecraft/launcher/ui/**,src/main/kotlin/com/minecraft/launcher/backend/StubLauncherBackend.kt,src/main/kotlin/com/minecraft/launcher/backend/HomeSnapshot.kt,src/main/kotlin/com/minecraft/launcher/backend/UiModels.kt \
            -Dsonar.exclusions=docs/**,gradle/wrapper/gradle-wrapper.jar